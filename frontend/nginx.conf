server {
    listen 80;
    listen [::]:80;
    server_name 34-64-159-225.sslip.io;

    # Let's Encrypt 인증서 발급 챌린지 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 인증서 발급 전 임시 접속 또는 HTTPS 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 34-64-159-225.sslip.io;

    # SSL 인증서 경로
    ssl_certificate /etc/letsencrypt/live/34-64-159-225.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/34-64-159-225.sslip.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 정적 파일 서빙 (React SPA)
    root /usr/share/nginx/html;
    index index.html;

    # PWA 서비스 워커 및 manifest 캐시 방지
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # API 리버스 프록시 (Spring Boot / Tomcat)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket 및 타임아웃 지원
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # SPA 클라이언트 라우팅
    location / {
        try_files $uri $uri/ /index.html;
    }
}
